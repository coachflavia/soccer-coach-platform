<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#020617">
    <title>Match unavailable offline — Coach Hub</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #020617; color: #f8fafc; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { width: min(100%, 38rem); padding: 2rem; border: 1px solid #1e293b; border-radius: 1.25rem; background: #0f172a; }
      h1 { margin-top: 0; font-size: 1.5rem; }
      p { color: #cbd5e1; line-height: 1.6; }
      a { display: inline-block; margin-top: .75rem; padding: .8rem 1rem; border-radius: .75rem; background: #34d399; color: #020617; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>This match isn’t available offline yet.</h1>
      <p>Connect to the internet and prepare it for offline use before kickoff. Your saved match data stays on this device.</p>
      <a href="/games">Back to Games Center</a>
    </main>
  </body>
</html>
